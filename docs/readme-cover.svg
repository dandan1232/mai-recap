<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">麦迹 · 把日常，再回味一遍</title>
  <desc id="desc">麦迹非官方项目封面：经典红黄、黑红标题和金拱门。把近期点餐记录收进五页回顾和一张分享小票。</desc>
  <rect width="1200" height="340" fill="#fffaf0"/>
  <rect x="790" width="410" height="340" fill="#cf0925"/>
  <path d="M0 336H1200" stroke="#ffbc0d" stroke-width="8"/>
  <g font-family="Microsoft YaHei,PingFang SC,sans-serif">
    <text x="52" y="58" fill="#cf0925" font-size="20" font-weight="700">麦迹 / MAI RECAP</text>
    <text x="48" y="144" fill="#252018" font-size="62" font-weight="800">把日常，</text>
    <text x="48" y="224" fill="#cf0925" font-size="62" font-weight="800">再回味一遍。</text>
    <text x="52" y="291" fill="#72534a" font-size="18">近期点餐记录 · 五页回顾 · 一张分享小票</text>
  </g>
  <path transform="translate(913 31) scale(1.65)" fill="#ffbc0d" d="M7 95C7-8 49-8 50 82C51-8 93-8 93 95H79C79 17 62 5 58 95H42C38 5 21 17 21 95Z"/>
  <g font-family="Microsoft YaHei,PingFang SC,sans-serif" text-anchor="middle">
    <text x="995" y="245" fill="#fffdf7" font-size="29" font-weight="700">好好吃饭，回忆打包。</text>
    <text x="995" y="293" fill="#ffe28a" font-size="13">非麦当劳官方产品 · 演示使用虚构订单</text>
  </g>
</svg>
